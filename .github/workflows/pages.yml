name: Deploy static site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static bundle
        run: |
          set -e
          mkdir -p _site
          cp -R index.html about-rixin.html capabilities.html contact.html industries.html industries-v2.html thank-you.html _site/
          cp -R blog zh ja _site/
          cp -R css js images fonts documents mediaelement data _site/
          cp -R php _site/
          cp -R robots.txt sitemap.xml .htaccess _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
